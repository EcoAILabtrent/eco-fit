name: Build APK

# Builds the Eco app in the cloud on every push (and on-demand), so you can
# download a ready APK from the Actions tab — even from your phone.
on:
  push:
    branches: [eco-flutter-app, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      # Release APK is signed with the debug key (see android/app/build.gradle),
      # so it installs directly on a phone for testing.
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: eco-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

          # APK весит ~154 МБ, а срок хранения у upload-artifact по умолчанию — 90 дней.
          # Шесть сборок от 14.07.2026 пролежали месяц и заняли 925 МБ — всю квоту
          # артефактов организации (free-план: 500 МБ на аккаунт, общие на все
          # репозитории). Расплачивался за это СОСЕДНИЙ репозиторий platforma: 10–11.08
          # его CI краснел на каждом прогоне, хотя все 1044 теста проходили, — падал
          # только шаг Upload с «Artifact storage quota has been hit».
          #
          # overwrite оставляет на диске ровно одну, последнюю сборку: имя артефакта
          # фиксированное, а с телефона всегда ставят свежий APK. Цена — APK старого
          # прогона уже не скачать, нужно перезапустить сборку на нужном коммите.
          overwrite: true
          retention-days: 7
