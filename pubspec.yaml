name: eco_mobile
description: "Eco — oilaviy ovqatlanish va salomatlik trackeri (Flutter, dizayn Eco 1.1.3)"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.4.3
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # Offline product database — 1122 Uzbek-cuisine products with full
    # macros + micronutrients (replaces the Supabase product table).
    - assets/foods.json
    - assets/db/eco_fit.db
    - assets/foods/images/
  fonts:
    # Onest variable font (wght 100–900) — bundled so the app is offline-first.
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest.ttf
